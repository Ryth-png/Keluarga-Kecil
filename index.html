<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lampu Hidup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      /* Background gradient gelap yang elegan */
      background: linear-gradient(135deg, #121212, #2c3e50);
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      /* Efek Glassmorphism (Kaca transparan) */
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
      font-size: 1.8rem;
      color: #f1c40f;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .box {
      position: relative;
      width: 350px;
      height: 350px;
      font-size: 6rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      transition: all 0.5s ease-in-out;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    /* --- Tampilan Saat Lampu Mati --- */
    .box.mati {
      background-color: rgba(0, 0, 0, 0.8);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
      /* Emoji ikut menjadi gelap/abu-abu saat lampu mati */
      filter: grayscale(100%) brightness(40%); 
    }

    /* --- Tampilan Saat Lampu Hidup --- */
    .box.hidup {
      background-color: rgba(255, 235, 100, 0.25);
      border-color: rgba(255, 235, 100, 0.6);
      /* Efek Glow (pendaran cahaya) ke luar dan ke dalam */
      box-shadow: 
        0 0 60px rgba(255, 235, 100, 0.5), 
        inset 0 0 40px rgba(255, 235, 100, 0.3);
      /* Emoji kembali berwarna cerah */
      filter: grayscale(0%) brightness(110%);
    }

    .buttons {
      display: flex;
      gap: 15px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn-hidup {
      background-color: #f1c40f;
      color: #111;
    }

    .btn-hidup:hover {
      background-color: #f39c12;
      box-shadow: 0 6px 20px rgba(241, 196, 15, 0.4);
      transform: translateY(-2px);
    }

    .btn-mati {
      background-color: #34495e;
      color: white;
    }

    .btn-mati:hover {
      background-color: #2c3e50;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(1px); /* Efek tombol ditekan */
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Simulasi Ruangan</h1>
    
    <!-- Tambahkan class 'mati' sebagai status awal -->
    <div class="box mati" id="lampu">
      👨‍👩‍👦‍👦
    </div>
    
    <div class="buttons">
      <button class="btn-hidup" onclick="hidup()">Lampu Hidup</button>
      <button class="btn-mati" onclick="mati()">Lampu Mati</button>
    </div>
  </div>

  <script>
    const lampu = document.getElementById("lampu");

    function hidup() {
      // Menghapus class 'mati' dan menambahkan class 'hidup'
      lampu.classList.remove("mati");
      lampu.classList.add("hidup");
    }

    function mati() {
      // Menghapus class 'hidup' dan menambahkan class 'mati'
      lampu.classList.remove("hidup");
      lampu.classList.add("mati");
    }
  </script>
</body>
</html>
